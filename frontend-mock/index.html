<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NODE Overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="wordmark">NODE</span></div>

      <nav class="sidebar-nav" aria-label="Primary">
        <a class="nav-item" href="#/overview" data-route="overview">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5"/><rect x="9" y="2.5" width="4.5" height="4.5"/><rect x="2.5" y="9" width="4.5" height="4.5"/><rect x="9" y="9" width="4.5" height="4.5"/></svg>
          <span>Overview</span>
        </a>
        <a class="nav-item" href="#/incidents" data-route="incidents">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5 14 13.5H2Z"/><path d="M8 6.5v3.5"/><path d="M8 11.5v.5"/></svg>
          <span>Incidents</span>
        </a>
        <a class="nav-item" href="#/shifts" data-route="shifts">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.5"/></svg>
          <span>Shifts</span>
        </a>
        <a class="nav-item" href="#/zones" data-route="zones">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11"/><path d="M7.5 2.5v11"/><path d="M7.5 8.5h6"/></svg>
          <span>Zones</span>
        </a>
        <a class="nav-item" href="#/reports" data-route="reports">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 1.5h6l3 3v10h-9Z"/><path d="M6 8h4.5"/><path d="M6 10.5h4.5"/></svg>
          <span>Reports</span>
        </a>
        <div class="nav-separator" role="separator"></div>
        <span class="nav-item is-disabled" aria-disabled="true" title="Admin only">
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11"/><path d="M2.5 11.5h11"/><rect x="5" y="3" width="2.5" height="3"/><rect x="9" y="10" width="2.5" height="3"/></svg>
          <span>Configuration</span>
          <svg class="icon icon-small nav-lock" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="5.5" width="7" height="5"/><path d="M4 5.5V4a2 2 0 0 1 4 0v1.5"/></svg>
        </span>
      </nav>

      <div class="sidebar-user" id="sidebar-user"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <nav class="scope" id="scope" aria-label="Scope"></nav>
        <div class="topbar-spacer"></div>
        <span class="topbar-date mono" id="clock-date"></span>
        <div class="segmented" id="period-control" role="group" aria-label="Period">
          <button type="button" data-period="today">Today</button>
          <button type="button" data-period="week">This week</button>
          <button type="button" data-period="month">This month</button>
        </div>
        <div class="live" id="live-status"></div>
        <button type="button" class="button">Export</button>
      </header>

      <main class="content" id="content"></main>
    </div>
  </div>

  <aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" aria-hidden="true"></aside>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
